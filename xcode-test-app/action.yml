name: Xcode Test App
description: Xcode Test App
inputs:
  platform:
    description: "Target Build Platform"
    default: "ios"
  lane:
    description: "Fastlane Lane Name"
    default: "tests"
  include_unit_tests:
    description: "Include Unit Tests"
    default: true
  include_ui_tests:
    description: "Include UI Tests"
    default: false
  retry_failed_tests:
    description: "Retry each failed test case once within the Fastlane test invocation"
    default: false
  reuse_generated_project:
    description: "Reuse a project generated by a prior step in the same checkout/job; only enable after that generation succeeds"
    default: false
runs:
  using: "composite"
  steps:
    # `retry_failed_tests` is an Xcode test-case retry inside each Fastlane invocation. The
    # infrastructure retries below rerun the entire lane only for classified build/environment failures.
    - name: Reset Retry Flag
      run: echo "RETRY_BUILD=false" >> "$GITHUB_ENV"
      shell: bash -leo pipefail {0}
      if: ${{ !cancelled() }}
    # Each invocation is preceded by a scope marker so the analysis steps below read only
    # the logs it writes. Every platform step in the job shares one `log` directory.
    - name: Scope Build Logs
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
    - name: Run Unit Tests
      id: build-app
      continue-on-error: true
      run: FASTLANE_REUSE_GENERATED_PROJECT=${{ inputs.reuse_generated_project }} bundle exec fastlane ${{ inputs.platform }} ${{ inputs.lane }} include_unit_tests:${{ inputs.include_unit_tests }} include_ui_tests:${{ inputs.include_ui_tests }} retry_failed_tests:${{ inputs.retry_failed_tests }}
      shell: bash -leo pipefail {0}
    - name: Show Test Failures
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: ${{ steps.build-app.outcome == 'failure' }}
    - name: Analyze Build Errors
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' }}
    - name: Scope Build Logs (Infrastructure Retry 1)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Run Unit Tests (Infrastructure Retry 1)
      id: retry-tests-1
      continue-on-error: true
      run: FASTLANE_REUSE_GENERATED_PROJECT=${{ inputs.reuse_generated_project }} bundle exec fastlane ${{ inputs.platform }} ${{ inputs.lane }} include_unit_tests:${{ inputs.include_unit_tests }} include_ui_tests:${{ inputs.include_ui_tests }} retry_failed_tests:${{ inputs.retry_failed_tests }}
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Show Test Failures (Infrastructure Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: ${{ steps.retry-tests-1.outcome == 'failure' }}
    - name: Abort Workflow (Non-recoverable build error)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' && env.RETRY_BUILD != 'true' }}
    - name: Reset Retry Flag
      run: echo "RETRY_BUILD=false" >> "$GITHUB_ENV"
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-tests-1.outcome == 'failure' }}
    - name: Analyze Build Errors (Infrastructure Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-tests-1.outcome == 'failure' }}
    - name: Scope Build Logs (Infrastructure Retry 2)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-tests-1.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Run Unit Tests (Infrastructure Retry 2)
      id: retry-tests-2
      continue-on-error: true
      run: FASTLANE_REUSE_GENERATED_PROJECT=${{ inputs.reuse_generated_project }} bundle exec fastlane ${{ inputs.platform }} ${{ inputs.lane }} include_unit_tests:${{ inputs.include_unit_tests }} include_ui_tests:${{ inputs.include_ui_tests }} retry_failed_tests:${{ inputs.retry_failed_tests }}
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-tests-1.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Show Test Failures (Infrastructure Retry 2)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: ${{ steps.retry-tests-2.outcome == 'failure' }}
    - name: Abort Workflow (Infrastructure Retry 1 Non-recoverable build error)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-tests-1.outcome == 'failure' && env.RETRY_BUILD != 'true' }}
    - name: Abort Workflow (Infrastructure Retry 2 Failed)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-tests-2.outcome == 'failure' }}
