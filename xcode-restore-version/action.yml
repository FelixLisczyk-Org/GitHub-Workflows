name: Restore Xcode Version
description: Restore the original Xcode version
inputs:
  original_xcode_path:
    description: "The original Xcode path to restore"
    required: true
  runner_root_password:
    description: "Root password for sudo operations"
    required: true
runs:
  using: "composite"
  steps:
    - name: (Local) Restore Original Xcode Version
      run: |
        echo "Restoring original Xcode version: ${{ inputs.original_xcode_path }}"
        echo "${{ inputs.runner_root_password }}" | sudo -S xcode-select -s "${{ inputs.original_xcode_path }}"
        xcodebuild -version
      shell: bash -leo pipefail {0}
      # An empty path means the prepare action failed before it selected an Xcode
      # version. finish-xcode-build runs with `if: always()`, so skip rather than
      # fail `xcode-select -s ""` and mask the original error.
      if: contains(runner.workspace, '/Users/runner/') == false && inputs.original_xcode_path != ''
