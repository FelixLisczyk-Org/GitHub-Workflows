name: Xcode Build App
description: Xcode Build App
inputs:
  platform:
    description: "Target Build Platform"
    default: "ios"
  lane:
    description: "Fastlane Lane Name"
    default: "release"
  inc_version:
    description: "Increment Version Number"
    required: true
  inc_build:
    description: "Increment Build Number"
    required: true
  update_deps:
    description: "Update Dependencies"
    required: true
  skip_tests:
    description: "Skip Tests"
    required: true
outputs:
  version:
    description: "Version number of the successfully uploaded app"
    value: ${{ steps.upload-identity.outputs.version }}
  build:
    description: "Build number of the successfully uploaded app"
    value: ${{ steps.upload-identity.outputs.build }}
runs:
  using: "composite"
  steps:
    - name: Prepare Uploaded Build Identity
      run: |
        identity_file="$RUNNER_TEMP/xcode-build-app-${GITHUB_RUN_ID}-${GITHUB_JOB}-${{ inputs.platform }}.txt"
        /bin/rm -f "$identity_file"
        echo "XCODE_BUILD_APP_IDENTITY_FILE=$identity_file" >> "$GITHUB_ENV"
      shell: bash -leo pipefail {0}
    - name: Resolve Swift Package Dependencies
      if: ${{ inputs.update_deps == 'true' }}
      run: TUIST_USE_SWIFTERPM=0 tuist install --update --quiet && tuist install
      shell: bash -leo pipefail {0}
    # Each invocation is preceded by a scope marker so the analysis steps below read only
    # the logs it writes. Every platform step in the job shares one `log` directory.
    - name: Scope Build Logs
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
    - name: Build and Upload App
      id: build-app
      continue-on-error: true
      run: bundle exec fastlane ${{ inputs.platform }} ${{ inputs.lane }} inc_version:${{ inputs.inc_version }} inc_build:${{ inputs.inc_build }} update_deps:${{ inputs.update_deps }} skip_publish:true skip_tests:${{ inputs.skip_tests }} clear_artifacts:false
      shell: bash -leo pipefail {0}
    - name: Analyze Build Errors
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' }}
    - name: Scope Build Logs (Retry 1)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Build and Upload App (Retry 1)
      id: retry-build-app-1
      continue-on-error: true
      run: bundle exec fastlane ${{ inputs.platform }} ${{ inputs.lane }} inc_version:false inc_build:false update_deps:false skip_publish:true skip_tests:${{ inputs.skip_tests }} clear_artifacts:false
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Abort Workflow (Non-recoverable build error)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.build-app.outcome == 'failure' && env.RETRY_BUILD != 'true' }}
    - name: Reset Retry Flag
      run: echo "RETRY_BUILD=false" >> "$GITHUB_ENV"
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-build-app-1.outcome == 'failure' }}
    - name: Analyze Build Errors (Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-build-app-1.outcome == 'failure' }}
    - name: Scope Build Logs (Retry 2)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-build-app-1.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Build and Upload App (Retry 2)
      id: retry-build-app-2
      continue-on-error: true
      run: bundle exec fastlane ${{ inputs.platform }} ${{ inputs.lane }} inc_version:false inc_build:false update_deps:false skip_publish:true skip_tests:${{ inputs.skip_tests }} clear_artifacts:false
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-build-app-1.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Abort Workflow (Retry 1 Non-recoverable build error)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-build-app-1.outcome == 'failure' && env.RETRY_BUILD != 'true' }}
    - name: Abort Workflow (Retry 2 Failed)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry-build-app-2.outcome == 'failure' }}
    - name: Publish Uploaded Build Identity
      id: upload-identity
      run: |
        if [[ ! -f "$XCODE_BUILD_APP_IDENTITY_FILE" ]]; then
          echo "Uploaded build identity file is missing." >&2
          exit 1
        fi

        version=""
        build=""
        while IFS='=' read -r key value; do
          case "$key" in
            version) version="$value" ;;
            build) build="$value" ;;
          esac
        done < "$XCODE_BUILD_APP_IDENTITY_FILE"

        if [[ -z "$version" || -z "$build" ]]; then
          echo "Uploaded build identity is incomplete." >&2
          exit 1
        fi

        printf 'version=%s\nbuild=%s\n' "$version" "$build" >> "$GITHUB_OUTPUT"
      shell: bash -leo pipefail {0}
