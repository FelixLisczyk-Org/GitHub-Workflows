name: Xcode Update App Dependencies
description: Xcode Update App Dependencies
inputs:
  github_token:
    description: "GitHub Access Token"
  platform:
    description: "Target Build Platform"
  skip_tests:
    description: "Skip Running Tests"
    required: false
    default: false
  ios_simulator_name:
    description: "Preferred iOS simulator device name"
    required: false
    default: "iPhone 17 Pro"

runs:
  using: "composite"
  steps:
    - name: Select iOS Simulator Destination
      run: |
        destination=$(python3 "${{ github.action_path }}/../shared-scripts/select-ios-simulator-destination.py" "${{ inputs.ios_simulator_name }}")
        echo "SCAN_DESTINATION=$destination" >> "$GITHUB_ENV"
        echo "IOS_SIMULATOR_DESTINATION=$destination" >> "$GITHUB_ENV"
        echo "Using iOS simulator destination: $destination"
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios'
    - name: Update Dependencies
      id: update_deps
      continue-on-error: true
      run: bundle exec fastlane ${{ inputs.platform }} update_deps skip_tests:${{ inputs.skip_tests }}
      shell: bash -leo pipefail {0}
    - name: Analyze Build Errors
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: ${{ steps.update_deps.outcome == 'failure' }}
    - name: Update Dependencies (Retry 1)
      id: retry_deps_1
      continue-on-error: true
      run: bundle exec fastlane ${{ inputs.platform }} update_deps skip_tests:${{ inputs.skip_tests }}
      shell: bash -leo pipefail {0}
      if: ${{ steps.update_deps.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Abort Workflow (Non-recoverable build error)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.update_deps.outcome == 'failure' && env.RETRY_BUILD != 'true' }}
    - name: Reset Retry Flag
      run: echo "RETRY_BUILD=false" >> "$GITHUB_ENV"
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry_deps_1.outcome == 'failure' }}
    - name: Analyze Build Errors (Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry_deps_1.outcome == 'failure' }}
    - name: Update Dependencies (Retry 2)
      id: retry_deps_2
      continue-on-error: true
      run: bundle exec fastlane ${{ inputs.platform }} update_deps skip_tests:${{ inputs.skip_tests }}
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry_deps_1.outcome == 'failure' && env.RETRY_BUILD == 'true' }}
    - name: Abort Workflow (Retry 1 Non-recoverable build error)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry_deps_1.outcome == 'failure' && env.RETRY_BUILD != 'true' }}
    - name: Abort Workflow (Retry 2 Failed)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: ${{ steps.retry_deps_2.outcome == 'failure' }}
    - name: Commit & Push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --staged --quiet || git commit -m "Updated dependencies [skip ci]"
        git push
      shell: bash -leo pipefail {0}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
