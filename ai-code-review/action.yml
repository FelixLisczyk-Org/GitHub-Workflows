name: AI Code Review
description: Run AI-powered code review on pull requests using OpenCode

# Usage:
#
#   name: AI Code Review
#   on:
#     pull_request:
#       types: [opened, synchronize]
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     review:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v7
#         - uses: <org>/GitHub-Workflows/ai-code-review@main
#           with:
#             api_key: ${{ secrets.OPENROUTER_API_KEY }}
#           env:
#             GH_TOKEN: ${{ github.token }}
#
# To include package changes made for the same ticket (commits on a package's
# default branch that reference the ticket ID, or an unmerged branch named after
# the ticket), pass a token that can read the owner's other repositories. The
# ticket ID comes from the PR title ("SX-914: ...") or branch name ("sx-914"):
#
#         - uses: <org>/GitHub-Workflows/ai-code-review@main
#           with:
#             api_key: ${{ secrets.OPENROUTER_API_KEY }}
#             token: ${{ secrets.REPO_ACCESS_TOKEN }}
#           env:
#             GH_TOKEN: ${{ github.token }}
#
# To use a different provider:
#
#         - uses: <org>/GitHub-Workflows/ai-code-review@main
#           with:
#             api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#             provider: anthropic
#             model: anthropic/claude-sonnet-4-5-20250929
#           env:
#             GH_TOKEN: ${{ github.token }}
#
# To use Ollama Cloud (no local Ollama installation required):
#
#         - uses: <org>/GitHub-Workflows/ai-code-review@main
#           with:
#             api_key: ${{ secrets.OLLAMA_API_KEY }}
#             provider: ollama
#             model: kimi-k2.6:cloud
#           env:
#             GH_TOKEN: ${{ github.token }}

inputs:
  api_key:
    description: "API key for the LLM provider"
    required: true
  pr_number:
    description: "Pull request number to review (for manual workflow dispatches)"
    required: false
  token:
    description: "Token that can read the owner's other repositories. Enables reviewing package changes made for the PR's ticket; omit to review the app diff alone"
    required: false
    default: ""
  provider:
    description: "LLM provider name (e.g., anthropic, openai, openrouter, groq, ollama)"
    default: "openrouter"
  model:
    description: "Model identifier. For most providers: provider/model-id. For ollama: model-name:cloud (e.g. kimi-k2.6:cloud)"
    default: "openrouter/anthropic/claude-opus-5.5"

runs:
  using: "composite"
  steps:
    - name: Install OpenCode
      run: |
        for attempt in 1 2 3; do
          echo "Installing OpenCode (attempt ${attempt}/3)..."
          if curl -fsSL https://opencode.ai/install | bash; then
            echo "OpenCode installed successfully."
            break
          fi
          if [ "${attempt}" -lt 3 ]; then
            echo "::warning::OpenCode install failed (attempt ${attempt}/3). Retrying in 5s..."
            sleep 5
          else
            echo "::error::OpenCode install failed after 3 attempts."
            exit 1
          fi
        done
      shell: bash -leo pipefail {0}

    - name: Run AI Code Review
      id: review
      continue-on-error: true
      run: ${{ github.action_path }}/scripts/run-review.sh
      shell: bash -leo pipefail {0}
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        API_KEY: ${{ inputs.api_key }}
        PACKAGES_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        ACTION_PATH: ${{ github.action_path }}

    - name: Review skipped or failed
      if: ${{ steps.review.outcome == 'failure' }}
      run: echo "::warning::AI code review failed or was skipped. This does not block the PR."
      shell: bash -leo pipefail {0}
