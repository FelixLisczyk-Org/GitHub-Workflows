name: Xcode Run Unit Tests in Package
description: Xcode Run Unit Tests in Package
inputs:
  platform:
    description: "Target Build Platform"
  scheme:
    description: "Xcode Scheme Name"
  retry_failed_tests:
    description: "Retry Failed Tests"
    required: false
    default: false
  ios_simulator_name:
    description: "Preferred iOS simulator device name"
    required: false
    default: "iPhone 17 Pro"

runs:
  using: "composite"
  steps:
    - name: Select iOS Simulator Destination
      run: |
        destination=$(python3 "${{ github.action_path }}/../shared-scripts/select-ios-simulator-destination.py" "${{ inputs.ios_simulator_name }}")
        echo "IOS_SIMULATOR_DESTINATION=$destination" >> "$GITHUB_ENV"
        echo "Using iOS simulator destination: $destination"
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios'
    - name: Generate Xcode Project
      run: |
        if [ -f Tuist.swift ]; then
          tuist install && tuist generate --no-open
        fi
      shell: bash -leo pipefail {0}
    - name: Run SwiftGen
      run: |
        if [ -f swiftgen.yml ]; then
          grep -E '^\s+output:' swiftgen.yml | awk '{print $2}' | xargs -I{} dirname {} | sort -u | xargs mkdir -p
          swiftgen config run --config swiftgen.yml
        fi
      shell: bash -leo pipefail {0}
    # Each invocation is preceded by a scope marker so the analysis steps below read
    # only the logs it writes, never a previous attempt's or another platform's.
    - name: Prepare Log Directory
      run: mkdir -p log && [ -e log/TestResults.xcresult ] && command rm -rf log/TestResults.xcresult || true
      shell: bash -leo pipefail {0}
    - name: Scope Build Logs (iOS)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios'
    - name: Run Unit Tests (iOS)
      id: test-ios
      continue-on-error: true
      run: |
        if [ -f Tuist.swift ] && ls *.xcworkspace >/dev/null 2>&1; then
          workspace=$(find . -name '*.xcworkspace' -maxdepth 1 | head -n 1)
          xcodebuild -workspace "$workspace" -scheme '${{ inputs.scheme }}' -destination "$IOS_SIMULATOR_DESTINATION" test \
          -resultBundlePath log/TestResults.xcresult \
          ${{ inputs.retry_failed_tests && '-retry-tests-on-failure' || '' }} | xcbeautify
        else
          swift test
        fi
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios'
    - name: Show Test Failures (iOS)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: inputs.platform == 'ios' && steps.test-ios.outcome == 'failure'
    - name: Analyze Build Errors (iOS)
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios' && steps.test-ios.outcome == 'failure'
    - name: Scope Build Logs (iOS) (Retry 1)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios' && steps.test-ios.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Run Unit Tests (iOS) (Retry 1)
      id: retry-ios-1
      continue-on-error: true
      run: |
        command rm -rf log/TestResults.xcresult
        if [ -f Tuist.swift ] && ls *.xcworkspace >/dev/null 2>&1; then
          workspace=$(find . -name '*.xcworkspace' -maxdepth 1 | head -n 1)
          xcodebuild -workspace "$workspace" -scheme '${{ inputs.scheme }}' -destination "$IOS_SIMULATOR_DESTINATION" test \
          -resultBundlePath log/TestResults.xcresult \
          ${{ inputs.retry_failed_tests && '-retry-tests-on-failure' || '' }} | xcbeautify
        else
          swift test
        fi
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios' && steps.test-ios.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Show Test Failures (iOS) (Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: steps.retry-ios-1.outcome == 'failure'
    - name: Abort Workflow (iOS Non-Recoverable)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'ios' && steps.test-ios.outcome == 'failure' && env.RETRY_BUILD != 'true'
    - name: Reset Retry Flag (iOS)
      run: echo "RETRY_BUILD=false" >> "$GITHUB_ENV"
      shell: bash -leo pipefail {0}
      if: steps.retry-ios-1.outcome == 'failure'
    - name: Analyze Build Errors (iOS) (Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: steps.retry-ios-1.outcome == 'failure'
    - name: Scope Build Logs (iOS) (Retry 2)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: steps.retry-ios-1.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Run Unit Tests (iOS) (Retry 2)
      id: retry-ios-2
      continue-on-error: true
      run: |
        command rm -rf log/TestResults.xcresult
        if [ -f Tuist.swift ] && ls *.xcworkspace >/dev/null 2>&1; then
          workspace=$(find . -name '*.xcworkspace' -maxdepth 1 | head -n 1)
          xcodebuild -workspace "$workspace" -scheme '${{ inputs.scheme }}' -destination "$IOS_SIMULATOR_DESTINATION" test \
          -resultBundlePath log/TestResults.xcresult \
          ${{ inputs.retry_failed_tests && '-retry-tests-on-failure' || '' }} | xcbeautify
        else
          swift test
        fi
      shell: bash -leo pipefail {0}
      if: steps.retry-ios-1.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Show Test Failures (iOS) (Retry 2)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: steps.retry-ios-2.outcome == 'failure'
    - name: Abort Workflow (iOS Retry 1 Non-Recoverable)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: steps.retry-ios-1.outcome == 'failure' && env.RETRY_BUILD != 'true'
    - name: Abort Workflow (iOS Retry 2 Failed)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: steps.retry-ios-2.outcome == 'failure'
    - name: Scope Build Logs (macOS)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'mac'
    - name: Run Unit Tests (macOS)
      id: test-macos
      continue-on-error: true
      run: |
        if [ -f Tuist.swift ] && ls *.xcworkspace >/dev/null 2>&1; then
          workspace=$(find . -name '*.xcworkspace' -maxdepth 1 | head -n 1)
          xcodebuild -workspace "$workspace" -scheme '${{ inputs.scheme }}' -sdk macosx test -allowProvisioningUpdates \
          -resultBundlePath log/TestResults.xcresult \
          ${{ inputs.retry_failed_tests && '-retry-tests-on-failure' || '' }} | xcbeautify
        else
          swift test
        fi
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'mac'
    - name: Show Test Failures (macOS)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: inputs.platform == 'mac' && steps.test-macos.outcome == 'failure'
    - name: Analyze Build Errors (macOS)
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'mac' && steps.test-macos.outcome == 'failure'
    - name: Scope Build Logs (macOS) (Retry 1)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'mac' && steps.test-macos.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Run Unit Tests (macOS) (Retry 1)
      id: retry-macos-1
      continue-on-error: true
      run: |
        command rm -rf log/TestResults.xcresult
        if [ -f Tuist.swift ] && ls *.xcworkspace >/dev/null 2>&1; then
          workspace=$(find . -name '*.xcworkspace' -maxdepth 1 | head -n 1)
          xcodebuild -workspace "$workspace" -scheme '${{ inputs.scheme }}' -sdk macosx test -allowProvisioningUpdates \
          -resultBundlePath log/TestResults.xcresult \
          ${{ inputs.retry_failed_tests && '-retry-tests-on-failure' || '' }} | xcbeautify
        else
          swift test
        fi
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'mac' && steps.test-macos.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Show Test Failures (macOS) (Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: steps.retry-macos-1.outcome == 'failure'
    - name: Abort Workflow (macOS Non-Recoverable)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: inputs.platform == 'mac' && steps.test-macos.outcome == 'failure' && env.RETRY_BUILD != 'true'
    - name: Reset Retry Flag (macOS)
      run: echo "RETRY_BUILD=false" >> "$GITHUB_ENV"
      shell: bash -leo pipefail {0}
      if: steps.retry-macos-1.outcome == 'failure'
    - name: Analyze Build Errors (macOS) (Retry 1)
      run: python3 ${{ github.action_path }}/../shared-scripts/check-build-errors.py
      shell: bash -leo pipefail {0}
      if: steps.retry-macos-1.outcome == 'failure'
    - name: Scope Build Logs (macOS) (Retry 2)
      run: "${{ github.action_path }}/../shared-scripts/scope-build-logs.sh"
      shell: bash -leo pipefail {0}
      if: steps.retry-macos-1.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Run Unit Tests (macOS) (Retry 2)
      id: retry-macos-2
      continue-on-error: true
      run: |
        command rm -rf log/TestResults.xcresult
        if [ -f Tuist.swift ] && ls *.xcworkspace >/dev/null 2>&1; then
          workspace=$(find . -name '*.xcworkspace' -maxdepth 1 | head -n 1)
          xcodebuild -workspace "$workspace" -scheme '${{ inputs.scheme }}' -sdk macosx test -allowProvisioningUpdates \
          -resultBundlePath log/TestResults.xcresult \
          ${{ inputs.retry_failed_tests && '-retry-tests-on-failure' || '' }} | xcbeautify
        else
          swift test
        fi
      shell: bash -leo pipefail {0}
      if: steps.retry-macos-1.outcome == 'failure' && env.RETRY_BUILD == 'true'
    - name: Show Test Failures (macOS) (Retry 2)
      run: python3 ${{ github.action_path }}/../shared-scripts/show-test-failures.py
      shell: bash -leo pipefail {0}
      continue-on-error: true
      if: steps.retry-macos-2.outcome == 'failure'
    - name: Abort Workflow (macOS Retry 1 Non-Recoverable)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: steps.retry-macos-1.outcome == 'failure' && env.RETRY_BUILD != 'true'
    - name: Abort Workflow (macOS Retry 2 Failed)
      run: exit 1
      shell: bash -leo pipefail {0}
      if: steps.retry-macos-2.outcome == 'failure'
