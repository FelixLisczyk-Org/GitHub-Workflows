name: Finish Xcode Build
description: Finish Xcode Build
inputs:
  runner_root_password:
    description: "Deprecated and ignored. Xcode is selected per job through DEVELOPER_DIR, so nothing machine-wide needs restoring. Callers can stop passing it at any time."
    required: false
runs:
  using: "composite"
  steps:
    - name: (Cloud) On Failure - Zip Workspace
      run: zip -r -q workspace.zip .
      shell: bash -leo pipefail {0}
      if: job.status == 'failure' && contains(runner.workspace, '/Users/runner/')
    - name: (Cloud) On Failure - Upload Workspace as Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: workspace
        path: workspace.zip
      if: job.status == 'failure' && contains(runner.workspace, '/Users/runner/')
    - name: Revert Git SSH Redirect
      run: |
        if git config --global --get url."git@github.com:".insteadOf >/dev/null 2>&1; then
          echo "Removing git SSH redirect config..."
          git config --global --unset url."git@github.com:".insteadOf "https://github.com/"
        else
          echo "Git SSH redirect config not found (already removed)"
        fi
      shell: bash -leo pipefail {0}
      if: always()
    - name: Remove [safe] section from gitconfig
      run: |
        git config --global --remove-section safe || echo "[safe] section not found"
      shell: bash -leo pipefail {0}
      if: always()
    - name: (Local) Mark Tuist Dependency State Valid
      run: |
        cache_directory="Tuist/.build"
        marker="$cache_directory/.package-resolved-hash"
        if [[ -d "$cache_directory" && -f "Tuist/Package.resolved" ]]; then
          printf '%s\n' "$(git hash-object Tuist/Package.resolved)" > "$marker"
        fi
      shell: bash -leo pipefail {0}
      if: job.status == 'success' && contains(runner.workspace, '/Users/runner/') == false
    - name: (Cloud) Tuist Dependency State (Save)
      uses: actions/cache/save@v6
      with:
        path: Tuist/.build
        key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist/Package.resolved') }}
      if: job.status == 'success' && contains(runner.workspace, '/Users/runner/') && hashFiles('Tuist/Package.resolved') != ''
