name: Prepare Xcode Build
description: Prepare Xcode Build
inputs:
  branch:
    description: "Custom ref/branch to check out (required for TestFlight submission workflow; defaults to the commit of the job that triggered this workflow)"
  p12_file_development:
    description: "Development Certificate File (required for dev and release builds)"
  p12_file_development_password:
    description: "Development Certificate Password (required for dev and release builds)"
  p12_file_distribution:
    description: "Distribution Certificate File (required for release builds)"
  p12_file_distribution_password:
    description: "Distribution Certificate Password (required for release builds)"
  ssh_private_key:
    description: "Private SSH Key (required for cloud runner)"
  runner_root_password:
    description: "Root password for sudo operations"
    required: true
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Required for scripts that access multiple branches, e.g. `increment-build-number.sh`
        ref: ${{ inputs.branch || '' }}
        # Persistent self-hosted workspaces retain Tuist/.build locally. Cloud runners
        # keep checkout's normal clean behavior because their workspaces are ephemeral.
        clean: ${{ contains(runner.workspace, '/Users/runner/') }}
    - name: (Local) Clean Workspace, Preserving Tuist Cache
      run: |
        # checkout's broad clean would remove the local Tuist cache on persistent runners.
        # Reset tracked files normally, then remove every ignored/untracked path except it.
        git reset --hard
        git clean -ffdx -e Tuist/.build
      shell: bash -leo pipefail {0}
      if: contains(runner.workspace, '/Users/runner/') == false
    - name: (Local) Validate Tuist Cache
      run: |
        cache_directory="Tuist/.build"
        marker="$cache_directory/.package-resolved-hash"
        if [[ ! -f "Tuist/Package.resolved" ]]; then
          echo "Tuist/Package.resolved is missing; clearing the local Tuist cache."
          rm -rf "$cache_directory"
          if [[ -e "$cache_directory" ]]; then
            echo "Unable to clear local Tuist cache at $cache_directory" >&2
            exit 1
          fi
          exit 0
        fi
        if [[ ! -d "$cache_directory" ]]; then
          exit 0
        fi

        package_hash=$(git hash-object Tuist/Package.resolved)
        if [[ ! -f "$marker" ]] || [[ "$(<"$marker")" != "$package_hash" ]]; then
          echo "Tuist cache is missing a valid Package.resolved marker; clearing it."
          rm -rf "$cache_directory"
          if [[ -e "$cache_directory" ]]; then
            echo "Unable to clear stale Tuist cache at $cache_directory" >&2
            exit 1
          fi
          exit 0
        fi

        # A cache is authoritative only after a successful job writes this marker.
        rm -f "$marker"
        if [[ -e "$marker" ]]; then
          echo "Unable to invalidate Tuist cache marker at $marker" >&2
          exit 1
        fi
      shell: bash -leo pipefail {0}
      if: contains(runner.workspace, '/Users/runner/') == false
    - name: (Local) Select Xcode Version
      id: select-xcode
      uses: FelixLisczyk-Org/GitHub-Workflows/xcode-select-version@main
      with:
        use_beta_xcode: ${{ github.ref == 'refs/heads/beta' }}
        runner_root_password: ${{ inputs.runner_root_password }}
    - name: (Local) Store Original Xcode Path # for later use in `finish-xcode-build`
      run: echo "ORIGINAL_XCODE_PATH=${{ steps.select-xcode.outputs.original_xcode_path }}" >> $GITHUB_ENV
      shell: bash -leo pipefail {0}
      if: contains(runner.workspace, '/Users/runner/') == false
    - name: (Cloud) Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: latest-stable
      if: contains(runner.workspace, '/Users/runner/')
    - name: Allow Swift Macros to be executed
      run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      shell: bash -leo pipefail {0}
    - name: (Cloud) Import Development Certificate
      id: create_keychain
      uses: apple-actions/import-codesign-certs@v6
      with:
        p12-file-base64: ${{ inputs.p12_file_development }}
        p12-password: ${{ inputs.p12_file_development_password }}
      if: contains(runner.workspace, '/Users/runner/') && inputs.p12_file_development != '' && inputs.p12_file_development_password != ''
    - name: (Cloud) Import Distribution Certificate
      uses: apple-actions/import-codesign-certs@v6
      with:
        create-keychain: false
        keychain-password: "${{ steps.create_keychain.outputs.keychain-password }}"
        p12-file-base64: ${{ inputs.p12_file_distribution }}
        p12-password: ${{ inputs.p12_file_distribution_password }}
      if: contains(runner.workspace, '/Users/runner/') && inputs.p12_file_distribution != '' && inputs.p12_file_distribution_password != ''
    - name: (Cloud) Load SSH Private Key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh_private_key }}
      if: contains(runner.workspace, '/Users/runner/') && inputs.ssh_private_key != ''
    - name: Clone Swift Packages over SSH
      run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      shell: bash -leo pipefail {0}
      # This step is required for the cache actions to find the `zstd` executable in the Homebrew directory.
    - name: (Local) Add PATH to GITHUB_PATH
      run: echo $PATH >> $GITHUB_PATH
      shell: bash -leo pipefail {0}
      if: contains(runner.workspace, '/Users/runner/') == false
    - name: (Cloud) Install Build Tools
      run: |
        brew update
        brew install sourcery swiftgen tuist xcbeautify
      shell: bash -leo pipefail {0}
      if: contains(runner.workspace, '/Users/runner/')
    - name: Install fastlane
      run: bundle install
      shell: bash -leo pipefail {0}
      if: hashFiles('Gemfile') != ''
    - name: Tuist Cache (Restore)
      uses: actions/cache/restore@v5
      with:
        path: Tuist/.build
        key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-tuist-
      if: contains(runner.workspace, '/Users/runner/') && hashFiles('Tuist/Package.resolved') != ''
